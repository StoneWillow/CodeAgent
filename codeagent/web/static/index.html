<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAgent</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a22;
      --border: #2a2f3a;
      --text: #e6e9ef;
      --muted: #8b93a7;
      --accent: #4f8cff;
      --user: #1f2a44;
      --assistant: #1a1f2b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
    }
    aside {
      width: 280px;
      border-right: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-width: 220px;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .chat-header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-shrink: 0;
    }
    #chat-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #usage {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    #status {
      padding: 8px 20px 0;
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }
    h1 {
      font-size: 16px;
      margin: 16px;
      font-weight: 600;
    }
    .toolbar {
      padding: 0 12px 12px;
      display: flex;
      gap: 8px;
    }
    input, button, textarea {
      font: inherit;
    }
    input[type="search"], textarea {
      background: #0d1017;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
    }
    input[type="search"] { flex: 1; width: 100%; }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
    }
    button.secondary {
      background: #2a3142;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #session-list {
      flex: 1;
      overflow: auto;
      padding: 0 8px 12px;
    }
    .session-item {
      padding: 10px 8px 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }
    .session-item:hover { background: #1e2430; }
    .session-item.active {
      background: #1b2438;
      border-color: #35548a;
    }
    .session-body { flex: 1; min-width: 0; }
    .session-title {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .session-snippet {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-del {
      background: transparent;
      color: var(--muted);
      padding: 2px 8px;
      font-size: 16px;
      line-height: 1.2;
      flex-shrink: 0;
      border-radius: 6px;
    }
    .session-del:hover { color: #ff8b8b; background: #2a1a1a; }
    #messages {
      flex: 1;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 900px;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user { background: var(--user); align-self: flex-end; }
    .msg.assistant { background: var(--assistant); align-self: flex-start; }
    .msg.compress {
      background: #161b14;
      color: #b7d59a;
      font-size: 13px;
      align-self: flex-start;
      border: 1px dashed #3d5a32;
    }
    .msg.ask {
      background: #1a1f2b;
      align-self: flex-start;
      border: 1px solid #35548a;
      max-width: 900px;
    }
    .ask-title {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .ask-q { font-weight: 600; }
    .ask-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
      white-space: pre-wrap;
    }
    .ask-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .ask-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      font-size: 13px;
    }
    .ask-free {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .ask-free textarea { min-height: 48px; }
    .composer {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      min-height: 56px;
      resize: vertical;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <aside>
    <h1>CodeAgent</h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索会话…" />
      <button id="new-chat" title="新对话">＋</button>
    </div>
    <div id="session-list"></div>
  </aside>
  <main>
    <header class="chat-header">
      <div id="chat-title">选择或新建一个对话</div>
      <div id="usage">上下文 — / —  ·  本会话累计 —</div>
    </header>
    <div id="status"></div>
    <div id="messages"><div class="empty">选择或新建一个对话</div></div>
    <div class="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="2"></textarea>
      <button id="send">发送</button>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentSessionId = null;
    let busy = false;
    let assistantNode = null;

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || res.statusText);
      }
      if ((options.headers || {})["Accept"] === "text/event-stream") {
        return res;
      }
      return res.json();
    }

    function setStatus(text) {
      $("status").textContent = text || "";
    }

    function formatTokens(n) {
      return Number(n || 0).toLocaleString();
    }

    function renderUsage(data) {
      if (!data || data.context_budget == null) return;
      const ctx = formatTokens(data.context_tokens);
      const budget = formatTokens(data.context_budget);
      const used = formatTokens(data.usage_tokens);
      $("usage").textContent = `上下文 ${ctx} / ${budget}  ·  本会话累计 ${used}`;
    }

    function setChatTitle(title) {
      $("chat-title").textContent = title || "新对话";
    }

    function renderSessions(sessions) {
      const list = $("session-list");
      if (!sessions.length) {
        list.innerHTML = '<div class="empty">暂无会话</div>';
        return;
      }
      list.innerHTML = "";
      for (const s of sessions) {
        const el = document.createElement("div");
        el.className = "session-item" + (s.id === currentSessionId ? " active" : "");
        el.dataset.id = s.id;
        const body = document.createElement("div");
        body.className = "session-body";
        body.innerHTML = `
          <div class="session-title">${escapeHtml(s.title || "新对话")}</div>
          <div class="session-meta">${escapeHtml(s.id)} · ${formatTime(s.updated_at)}</div>
          ${s.snippet ? `<div class="session-snippet">${escapeHtml(s.snippet)}</div>` : ""}
        `;
        const del = document.createElement("button");
        del.className = "session-del";
        del.type = "button";
        del.title = "删除会话";
        del.textContent = "×";
        del.addEventListener("click", (ev) => {
          ev.stopPropagation();
          deleteSession(s.id);
        });
        el.appendChild(body);
        el.appendChild(del);
        el.addEventListener("click", () => loadSession(s.id));
        list.appendChild(el);
      }
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function formatTime(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString();
      } catch {
        return iso;
      }
    }

    async function refreshSessions(query = "") {
      const data = query
        ? await api(`/api/sessions/search?q=${encodeURIComponent(query)}`)
        : await api("/api/sessions");
      renderSessions(data.sessions || []);
    }

    function renderMessages(messages) {
      const box = $("messages");
      box.innerHTML = "";
      if (!messages.length) {
        box.innerHTML = '<div class="empty">开始新对话吧</div>';
        return;
      }
      for (const m of messages) {
        appendMessage(m.role, m.content);
      }
      box.scrollTop = box.scrollHeight;
    }

    function appendMessage(role, content, extraClass = "") {
      const box = $("messages");
      const empty = box.querySelector(".empty");
      if (empty) empty.remove();
      const el = document.createElement("div");
      el.className = `msg ${role} ${extraClass}`.trim();
      el.textContent = content;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
      return el;
    }

    async function loadSession(id) {
      const data = await api(`/api/sessions/${id}`);
      currentSessionId = data.id;
      renderMessages(data.messages || []);
      await refreshSessions($("search").value.trim());
      setChatTitle(data.title || "新对话");
      renderUsage(data);
      setStatus("");
    }

    async function createSession() {
      const data = await api("/api/sessions", { method: "POST", body: "{}" });
      currentSessionId = data.id;
      renderMessages([]);
      await refreshSessions();
      setChatTitle(data.title || "新对话");
      renderUsage(data);
      setStatus("");
    }

    async function deleteSession(id) {
      if (busy && id === currentSessionId) {
        setStatus("对话进行中，请等本轮结束后再删除");
        return;
      }
      if (!window.confirm("删除这个会话？此操作不可恢复。")) {
        return;
      }
      await api(`/api/sessions/${id}`, { method: "DELETE" });
      if (id !== currentSessionId) {
        await refreshSessions($("search").value.trim());
        return;
      }
      currentSessionId = null;
      const data = await api("/api/sessions");
      const rest = data.sessions || [];
      if (rest.length) {
        await loadSession(rest[0].id);
      } else {
        await createSession();
      }
    }

    function handleConfirm(payload) {
      return new Promise((resolve) => {
        assistantNode = null;
        const box = $("messages");
        const empty = box.querySelector(".empty");
        if (empty) empty.remove();

        const card = document.createElement("div");
        card.className = "msg ask";

        async function finish(body, userText) {
          card.querySelectorAll("button, input, textarea").forEach((el) => {
            el.disabled = true;
          });
          appendMessage("user", userText);
          try {
            await api("/api/confirm", {
              method: "POST",
              body: JSON.stringify(body),
            });
          } finally {
            resolve();
          }
        }

        if (payload.type === "bash") {
          const title = document.createElement("div");
          title.className = "ask-title";
          title.textContent = "需要你确认 Bash 命令";
          const q = document.createElement("div");
          q.className = "ask-q";
          q.textContent = payload.reason || "未匹配白名单";
          const meta = document.createElement("div");
          meta.className = "ask-meta";
          meta.textContent = payload.command || "";
          const row = document.createElement("div");
          row.className = "ask-options";
          const yes = document.createElement("button");
          yes.textContent = "允许";
          const no = document.createElement("button");
          no.className = "secondary";
          no.textContent = "拒绝";
          yes.onclick = () => finish({ approved: true }, "允许执行该命令");
          no.onclick = () => finish({ approved: false }, "拒绝执行该命令");
          row.append(yes, no);
          card.append(title, q, meta, row);
        } else {
          const title = document.createElement("div");
          title.className = "ask-title";
          title.textContent = "Agent 向你提问";
          const q = document.createElement("div");
          q.className = "ask-q";
          q.textContent = payload.question || "需要你确认";
          card.append(title, q);
          const options = payload.options || [];
          if (options.length && !payload.allow_multiple) {
            const row = document.createElement("div");
            row.className = "ask-options";
            for (const opt of options) {
              const btn = document.createElement("button");
              btn.textContent = opt;
              btn.onclick = () => finish({ answer: opt }, opt);
              row.appendChild(btn);
            }
            card.appendChild(row);
          } else if (options.length && payload.allow_multiple) {
            const row = document.createElement("div");
            row.className = "ask-options";
            const boxes = [];
            for (const opt of options) {
              const label = document.createElement("label");
              const cb = document.createElement("input");
              cb.type = "checkbox";
              cb.value = opt;
              label.append(cb, document.createTextNode(" " + opt));
              row.appendChild(label);
              boxes.push(cb);
            }
            const submit = document.createElement("button");
            submit.textContent = "确定";
            submit.onclick = () => {
              const picks = boxes.filter((c) => c.checked).map((c) => c.value);
              const answer = picks.join(", ");
              finish({ answer }, answer || "(未选择)");
            };
            card.append(row, submit);
          } else {
            const row = document.createElement("div");
            row.className = "ask-free";
            const input = document.createElement("textarea");
            input.rows = 2;
            input.placeholder = "在此输入回答，会作为你的消息留下";
            const submit = document.createElement("button");
            submit.textContent = "发送";
            const sendFree = () => {
              const answer = input.value.trim();
              finish({ answer }, answer || "(空)");
            };
            submit.onclick = sendFree;
            input.addEventListener("keydown", (e) => {
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendFree();
              }
            });
            row.append(input, submit);
            card.appendChild(row);
          }
        }
        box.appendChild(card);
        box.scrollTop = box.scrollHeight;
      });
    }

    async function sendMessage() {
      const text = $("input").value.trim();
      if (!text || busy) return;
      if (!currentSessionId) {
        await createSession();
      }
      busy = true;
      $("send").disabled = true;
      $("input").disabled = true;
      appendMessage("user", text);
      $("input").value = "";
      assistantNode = null;
      setStatus("Agent 正在回复…");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: currentSessionId, message: text }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || res.statusText);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop() || "";
          for (const part of parts) {
            const lines = part.split("\n");
            let event = "message";
            let data = "";
            for (const line of lines) {
              if (line.startsWith("event: ")) event = line.slice(7);
              if (line.startsWith("data: ")) data = line.slice(6);
            }
            if (!data) continue;
            const payload = JSON.parse(data);
            if (event === "token") {
              if (!assistantNode) {
                assistantNode = appendMessage("assistant", "");
              }
              assistantNode.textContent += payload.text;
              $("messages").scrollTop = $("messages").scrollHeight;
            } else if (event === "tool") {
              assistantNode = null;
              appendMessage("tool", `[工具] ${payload.name}(${JSON.stringify(payload.arguments || {})})`, "tool");
            } else if (event === "compress") {
              assistantNode = null;
              appendMessage("compress", payload.message || "[上下文] 压缩", "compress");
              setStatus(payload.message || "");
            } else if (event === "confirm") {
              await handleConfirm(payload);
            } else if (event === "error") {
              if (!assistantNode) {
                assistantNode = appendMessage("assistant", "");
              }
              assistantNode.textContent = payload.message || "发生错误";
            } else if (event === "done") {
              if (payload.text && (!assistantNode || !assistantNode.textContent)) {
                if (!assistantNode) {
                  assistantNode = appendMessage("assistant", payload.text);
                } else {
                  assistantNode.textContent = payload.text;
                }
              }
              renderUsage(payload);
              await reader.cancel().catch(() => {});
              return;
            }
          }
        }
      } catch (err) {
        appendMessage("assistant", String(err.message || err));
      } finally {
        busy = false;
        $("send").disabled = false;
        $("input").disabled = false;
        $("input").focus();
        setStatus("");
        await refreshSessions($("search").value.trim());
      }
    }

    $("new-chat").onclick = createSession;
    $("send").onclick = sendMessage;
    $("input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    let searchTimer = null;
    $("search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => refreshSessions($("search").value.trim()), 250);
    });

    refreshSessions().then(async () => {
      const data = await api("/api/sessions");
      if (data.sessions && data.sessions.length) {
        await loadSession(data.sessions[0].id);
      } else {
        await createSession();
      }
    });
  </script>
</body>
</html>
